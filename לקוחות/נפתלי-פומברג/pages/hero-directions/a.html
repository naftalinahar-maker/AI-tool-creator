<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כיוון א: אור</title>
<style>
@font-face{font-family:Heebo;font-weight:400;src:url(fonts/heebo-hebrew-400-normal.woff2) format("woff2")}
@font-face{font-family:Heebo;font-weight:700;src:url(fonts/heebo-hebrew-700-normal.woff2) format("woff2")}
@font-face{font-family:Heebo;font-weight:800;src:url(fonts/heebo-hebrew-800-normal.woff2) format("woff2")}
:root{--teal:#0B3B3F;--teal-2:#0F4A4F;--gold:#C5A055;--gold-soft:#F3DFA5;--cream:#FBF8F1;--ink:#0C0D0E}
*{box-sizing:border-box;margin:0}
body{font-family:Heebo,system-ui,sans-serif;background:var(--teal);color:var(--cream)}
.hero{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:40px 72px 64px;max-width:1440px;margin:0 auto}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;align-self:start}
header img{height:22px;filter:invert(1) brightness(1.2)}
header span{font-size:15px;color:var(--gold-soft)}
.eyebrow{display:inline-flex;gap:10px;align-items:center;font-weight:700;font-size:16px;color:var(--gold);letter-spacing:.02em}
.eyebrow i{width:36px;height:2px;background:var(--gold);display:block}
h1{font-weight:800;font-size:clamp(44px,6.4vw,92px);line-height:.98;margin:22px 0 22px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--gold)}
.sub{font-size:clamp(19px,1.7vw,24px);line-height:1.5;max-width:30ch;color:#E6EDEC}
.when{display:flex;flex-wrap:wrap;gap:12px;margin:34px 0 36px}
.when div{border:1px solid rgba(197,160,85,.55);border-radius:10px;padding:12px 18px;font-size:17px}
.when b{display:block;font-size:13px;font-weight:400;color:var(--gold-soft);margin-bottom:2px}
.cta{display:inline-block;background:var(--gold);color:var(--teal);font-weight:800;font-size:20px;padding:20px 40px;border-radius:12px;text-decoration:none}
.note{margin-top:14px;font-size:15px;color:#B9CBC9}
.photo{position:relative;height:min(78vh,720px);border-radius:28px 28px 28px 220px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:76% 30%}
.photo figcaption{position:absolute;bottom:22px;right:22px;background:var(--cream);color:var(--teal);padding:12px 18px;border-radius:12px;font-size:15px;line-height:1.35}
.photo figcaption b{display:block;font-size:17px}
@media (max-width:860px){
 .hero{grid-template-columns:1fr;gap:28px;padding:20px 18px 40px}
 .photo{order:-1;height:56vh;border-radius:20px 20px 20px 120px;grid-row:2}
 header{grid-row:1}
 .text{grid-row:3}
 .when div{flex:1 1 40%}
 .when div:first-child{flex-basis:100%}
 .cta{display:block;text-align:center}
}
</style>
</head>
<body>
<section class="hero">
 <header><img src="img/fomberg-logo.png" alt="פומברג"><span>הרצאה חיה בזום</span></header>
 <div class="text">
  <span class="eyebrow"><i></i>למאמנים, יועצים ומטפלים עם שליחות</span>
  <h1>להשפיע <em>בענק</em><br>על העולם</h1>
  <p class="sub">באמצעות הרצאה בזום ושיווק דיגיטלי שמחובר לערכים שלך</p>
  <div class="when">
   <div><b>מתי</b>יום ראשון, י״ז בטבת</div>
   <div><b>תאריך</b>27.12</div>
   <div><b>שעה</b>11:00</div>
  </div>
  <a class="cta" href="#form">שמרו לי מקום בהרצאה</a>
  <p class="note">ההרשמה לוקחת חצי דקה</p>
 </div>
 <figure class="photo">
  <img src="img/naftali-hero.webp" alt="נפתלי פומברג">
  <figcaption><b>נפתלי פומברג</b>חסיד ברסלב, אבא ל־9 ואיש שיווק</figcaption>
 </figure>
</section>
</body>
</html>
